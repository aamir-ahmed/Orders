$kind: http-request
description: |
  Requests cancellation for an order.

  - If the order is already shipped/delivered, cancellation may be rejected.
  - This operation is idempotent when using **Idempotency-Key**.
url: "{{baseUrl}}/orders/:orderId/cancel"
method: POST
headers:
  - key: Idempotency-Key
    value: string
    disabled: false
    description: |
      A unique key (typically a UUID) that the client provides to make a request idempotent.
      Repeating a request with the same key should not create duplicate resources.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "maxLength": 128
          }
        }
      }
  - key: X-Correlation-Id
    value: string
    disabled: false
    description: Client-provided correlation ID for request tracing.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "maxLength": 128
          }
        }
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: orderId
    value: string
    disabled: false
    description: Order identifier
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "reason": "Partner requested cancellation."
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "reason": {
          "type": "string",
          "description": "Optional reason for cancellation"
        }
      }
    }
settings: {}
examples: ./.resources/Cancel an order.resources/examples
order: 1000
