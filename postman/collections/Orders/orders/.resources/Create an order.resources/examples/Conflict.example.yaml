$kind: http-example
request:
  url: "{{baseUrl}}/orders"
  method: POST
  headers:
    - key: Idempotency-Key
      value: string
      disabled: false
      description: |
        A unique key (typically a UUID) that the client provides to make a request idempotent.
        Repeating a request with the same key should not create duplicate resources.
    - key: X-Correlation-Id
      value: string
      disabled: false
      description: Client-provided correlation ID for request tracing.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "customerId": "cust_67890",
        "currency": "USD",
        "items": [
          {
            "sku": "HP-LJ-MFP-M234SDW",
            "quantity": 1
          },
          {
            "sku": "W1470A",
            "quantity": 2
          }
        ],
        "shippingAddress": {
          "line1": "1501 Page Mill Rd",
          "city": "Palo Alto",
          "region": "CA",
          "postalCode": "94304",
          "country": "US"
        },
        "billingAddress": {
          "line1": "1501 Page Mill Rd",
          "city": "Palo Alto",
          "region": "CA",
          "postalCode": "94304",
          "country": "US"
        },
        "notes": "Partner order submission.",
        "metadata": {
          "partnerId": "prt_13579",
          "channel": "PARTNER",
          "purchaseOrderNumber": "PO-1000456"
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
    X-Correlation-Id: ""
  body:
    type: json
    content: |-
      {
        "code": "CONFLICT",
        "message": "An order with the same idempotency key already exists.",
        "correlationId": "corr_abc123"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "example": "INVALID_REQUEST",
            "description": "Stable, machine-readable error code"
          },
          "message": {
            "type": "string",
            "example": "One or more fields are invalid.",
            "description": "Human-readable error message"
          },
          "correlationId": {
            "type": "string",
            "description": "Correlation ID for troubleshooting"
          },
          "details": {
            "type": "array",
            "description": "Optional list of validation or domain errors",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string"
                },
                "issue": {
                  "type": "string"
                }
              },
              "required": [
                "field",
                "issue"
              ]
            }
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 3000
